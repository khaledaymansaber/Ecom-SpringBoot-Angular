server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ecommerce-api
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

# JWT configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 hours
  cookie-name: token
  issuer: http://localhost:8080

# Mail configuration (Gmail SMTP as in .NET, can be overridden by env vars)
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME:k8340896@gmail.com}
  password: ${MAIL_PASSWORD:dlinnuwykzaqbsvl}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# Image upload directory
app:
  upload:
    dir: uploads/images
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
