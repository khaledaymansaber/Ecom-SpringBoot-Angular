<div class="card h-100 shadow-sm border-0">
  <div class="position-relative text-center p-3 bg-light rounded-top">
    <a [routerLink]="['/shop/product-details', product.id]">
      <img
        [src]="product.photos && product.photos.length > 0 ? getImageUrl(product.photos[0].imageName) : './favicon.ico'"
        (error)="$any($event.target).src = './favicon.ico'"
        class="card-img-top img-fluid"
        style="height: 180px; object-fit: contain;"
        alt="{{ product.name }}"
      />
    </a>
    <button (click)="addToWishlist()" class="btn btn-sm btn-light position-absolute top-0 end-0 m-2 rounded-circle text-danger shadow-sm" title="Add to Wishlist">
      <i class="fa fa-heart-o"></i>
    </button>
  </div>

  <div class="card-body d-flex flex-column">
    <div class="thumbnails mb-2" *ngIf="product.photos && product.photos.length > 1">
      <img *ngFor="let item of product.photos"
           [src]="getImageUrl(item.imageName)"
           alt="thumbnail"
           class="small-img me-1 rounded border"
           style="width: 32px; height: 32px; object-fit: cover;" />
    </div>

    <span class="badge bg-secondary align-self-start mb-2">{{ product.categoryName }}</span>
    <h6 class="card-title fw-bold text-truncate" title="{{ product.name }}">
      <a [routerLink]="['/shop/product-details', product.id]" class="text-decoration-none text-dark">{{ product.name }}</a>
    </h6>
    <p class="card-text text-muted small flex-grow-1 text-truncate" style="max-height: 40px;">
      {{ product.description }}
    </p>

    <div class="d-flex justify-content-between align-items-baseline my-2">
      <div>
        <span class="fs-5 fw-bold text-primary">{{ product.newPrice | currency }}</span>
        <span class="text-muted text-decoration-line-through small ms-2" *ngIf="product.oldPrice > product.newPrice">
          {{ product.oldPrice | currency }}
        </span>
      </div>
    </div>

    <div class="d-flex justify-content-between gap-2 mt-auto">
      <button (click)="SetBasketValue()" class="btn btn-primary flex-grow-1">
        <i class="fa fa-shopping-cart me-1"></i> Add to Cart
      </button>
      <button [routerLink]="['/shop/product-details', product.id]" class="btn btn-outline-secondary">
        <i class="fa fa-info-circle"></i>
      </button>
    </div>
  </div>
</div>
